<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Service</title>
    
    <link rel="stylesheet" href="eth.css">

    <style>
        body {
            background-image: url('WhatsApp Image 2024-12-13 at 00.09.28_847a136e.jpg');
            background-repeat: no-repeat;
        } </style>
</head>

<body>
<header>
    <h1>Welcome to Our Customer Service</h1>
    <p>We are here to support you every step of the way. Feel free to reach out and we'll be happy to assist you.</p>
</header>

<section class="contact-form">
    <h2>We are happy to hear from you</h2>
    <form action="#">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email address" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" placeholder="Write your message here" rows="5" required></textarea>

        <button type="submit">Send Message</button>
    </form>
</section>

<footer>
    <p>© 2024 Customer Service. All Rights Reserved.</p>
    <p>Follow us on:</p>
    <div class="social-icons">
        <a href="#">Facebook</a>
        <a href="#">Twitter</a>
        <a href="#">Instagram</a>
    </div>
</footer>

</body>
</html>
